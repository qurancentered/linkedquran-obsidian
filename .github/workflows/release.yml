# Pushing a version tag (e.g. `git tag -a 1.14.1 -m "notes" && git push origin 1.14.1`) attests the
# committed plugin files and publishes them as a release. There is no build step: main.js is the source.
# Run it by hand with an existing tag to attest a release made before this workflow.
name: Release

on:
  push:
    tags: ["*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to attest
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Version matches tag
        run: |
          test "$(jq -r .version manifest.json)" = "$TAG"
          jq -e --arg v "$TAG" 'has($v)' versions.json

      - uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Release
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; attested only."
          else
            gh release create "$TAG" main.js manifest.json styles.css --title "$TAG" --notes-from-tag --verify-tag
          fi
